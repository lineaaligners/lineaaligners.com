<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vlerësim falas i buzëqeshjes — Linea Aligners</title>
<meta name="description" content="Dërgo 3 foto të dhëmbëve dhe merr vlerësim falas nga një dentist i Linea Aligners brenda 24 orëve.">
<meta property="og:title" content="Vlerësim falas i buzëqeshjes — Linea Aligners">
<meta property="og:description" content="Zbulo nëse aligner-at e padukshëm janë për ty. Falas, pa detyrim.">
<meta name="theme-color" content="#1A1B48">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0d0e2b;color:#f4f4fb;font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg span{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35}
.bg .o1{width:460px;height:460px;background:#4E4F9E;top:-160px;left:-120px;animation:d1 20s ease-in-out infinite}
.bg .o2{width:420px;height:420px;background:#7c7fd6;bottom:-180px;right:-140px;animation:d2 24s ease-in-out infinite}
@keyframes d1{50%{transform:translate(60px,50px) scale(1.12)}}@keyframes d2{50%{transform:translate(-50px,-60px) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:20px 18px calc(48px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 22px}
.brand{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:.02em}
.lang{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 14px;font:600 12px Poppins;cursor:pointer}
.card{background:rgba(26,27,72,.72);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:26px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.35);animation:up .6s cubic-bezier(.16,1,.3,1) both}
.eyebrow{display:inline-block;margin:0 0 12px;padding:5px 12px;border-radius:999px;background:rgba(124,127,214,.22);color:#c9caf5;font-size:12px;font-weight:600;letter-spacing:.04em}
h1{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1.1;font-weight:600;margin:0 0 10px}
h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;margin:10px 0 8px}
.sub{margin:0 0 18px;opacity:.75;font-size:14px;line-height:1.6}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0;margin:0 0 22px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:11.5px;line-height:1.35;opacity:.9}
.steps li::before{content:counter(s);display:flex;width:22px;height:22px;border-radius:50%;background:#4E4F9E;align-items:center;justify-content:center;font-weight:700;font-size:11px;margin-bottom:6px}
form{display:flex;flex-direction:column;gap:16px}
label,.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:500}
input[type=text],input[type=tel],input:not([type]),textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:13px 14px;color:#fff;font:400 15px Poppins;outline:none;transition:border-color .2s,background .2s}
input:focus,textarea:focus{border-color:#8b8ef0;background:rgba(255,255,255,.09)}
textarea{resize:vertical}
.hint{margin:-2px 0 2px;font-size:12px;opacity:.55;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:8px 14px;font:500 13px Poppins;cursor:pointer;transition:all .2s}
.chip.on{background:#4E4F9E;border-color:#8b8ef0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:1;border:1.5px dashed rgba(255,255,255,.25);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;font-size:11px;padding:8px;cursor:pointer;overflow:hidden;background:rgba(255,255,255,.04)}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .plus{font-size:22px;line-height:1;opacity:.7}
.slot.has{border-style:solid;border-color:#8b8ef0}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.consent{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:12.5px;opacity:.85;line-height:1.5}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:#4E4F9E;flex:none}
.err{color:#fca5a5;font-size:13px;margin:0;min-height:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:16px;background:linear-gradient(135deg,#4E4F9E,#6d70d8);color:#fff;font:600 15px Poppins;cursor:pointer;box-shadow:0 14px 34px rgba(78,79,158,.45);transition:transform .15s,opacity .2s;text-decoration:none}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
.fine{margin:0;text-align:center;font-size:11.5px;opacity:.5}
.hidden{display:none}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.check{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.15);border:2px solid #22c55e;display:flex;align-items:center;justify-content:center;font-size:34px;color:#22c55e;animation:up .5s .1s both}
@media (max-width:420px){h1{font-size:29px}.steps li{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span class="o1"></span><span class="o2"></span></div>
<main>
  <header><a class="brand" href="/">Linea</a><button class="lang" id="langBtn" type="button">EN</button></header>
  <section class="card" id="formView">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <ol class="steps"><li data-t="step1"></li><li data-t="step2"></li><li data-t="step3"></li></ol>
    <form id="f" novalidate>
      <label><span data-t="name"></span><input name="name" maxlength="80" autocomplete="name" required></label>
      <label><span data-t="phone"></span><input name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="+383 4X XXX XXX" required></label>
      <label><span data-t="city"></span><input name="city" maxlength="60" autocomplete="address-level2" placeholder="Pejë, Prishtinë…"></label>
      <div class="field"><span data-t="concern"></span><div class="chips" id="chips"></div></div>
      <div class="field"><span data-t="photos"></span><p class="hint" data-t="photosHint"></p><div class="slots" id="slots"></div></div>
      <label><span data-t="message"></span><textarea name="message" rows="3" maxlength="1000"></textarea></label>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent"><input type="checkbox" name="consent"><span data-t="consent"></span></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="submitBtn" data-t="submit"></button>
      <p class="fine" data-t="fine"></p>
    </form>
  </section>
  <section class="card done hidden" id="doneView">
    <div class="check">✓</div>
    <h2 data-t="doneTitle"></h2>
    <p class="sub" data-t="doneBody"></p>
    <a class="btn" id="waBtn" target="_blank" rel="noopener noreferrer" data-t="doneWa"></a>
    <a class="btn ghost" href="/" data-t="back"></a>
  </section>
</main>
<script>
(function(){
var T={"sq": {"eyebrow": "Falas · Pa detyrim", "title": "Zbulo nëse aligner-at janë për ty", "sub": "Dërgo 3 foto të dhëmbëve dhe një dentist i Linea-s të përgjigjet brenda 24 orëve me vlerësimin dhe çmimin e përafërt.", "step1": "Plotëso të dhënat", "step2": "Ngarko 3 foto me telefon", "step3": "Merr përgjigje në WhatsApp", "name": "Emri e mbiemri *", "phone": "Numri i telefonit (WhatsApp) *", "city": "Qyteti", "concern": "Çfarë dëshiron të rregullosh?", "photos": "Fotot e dhëmbëve", "photosHint": "Në dritë të mirë. Opsionale, por na ndihmojnë të japim vlerësim më të saktë.", "addPhoto": "Shto foto", "message": "Diçka tjetër që duhet ta dimë? (opsionale)", "consent": "Pajtohem që Linea Aligners të më kontaktojë dhe t’i shqyrtojë fotot e mia vetëm për këtë vlerësim.", "submit": "Dërgo vlerësimin falas", "sending": "Duke dërguar…", "fine": "Fotot ruhen në mënyrë private dhe i sheh vetëm ekipi ynë klinik.", "errReq": "Shkruaj emrin dhe një numër telefoni të vlefshëm.", "errConsent": "Duhet të pajtohesh që të të kontaktojmë.", "errSend": "Diçka nuk shkoi. Provo përsëri ose na shkruaj në WhatsApp.", "doneTitle": "Faleminderit!", "doneBody": "E morëm vlerësimin tënd. Një dentist i Linea-s do të të shkruajë në WhatsApp brenda 24 orëve.", "doneWa": "Na shkruaj tani në WhatsApp", "back": "Kthehu te faqja", "waText": "Përshëndetje! Sapo dërgova vlerësimin falas. Emri im: ", "docTitle": "Vlerësim falas i buzëqeshjes — Linea Aligners"}, "en": {"eyebrow": "Free · No commitment", "title": "Find out if clear aligners are right for you", "sub": "Send 3 photos of your teeth and a Linea dentist will reply within 24 hours with an assessment and an approximate price.", "step1": "Fill in your details", "step2": "Upload 3 phone photos", "step3": "Get your answer on WhatsApp", "name": "Full name *", "phone": "Phone number (WhatsApp) *", "city": "City", "concern": "What would you like to fix?", "photos": "Photos of your teeth", "photosHint": "In good light. Optional, but they help us give a more accurate assessment.", "addPhoto": "Add photo", "message": "Anything else we should know? (optional)", "consent": "I agree that Linea Aligners may contact me and review my photos only for this assessment.", "submit": "Send my free assessment", "sending": "Sending…", "fine": "Photos are stored privately and only our clinical team can see them.", "errReq": "Please enter your name and a valid phone number.", "errConsent": "Please agree to be contacted.", "errSend": "Something went wrong. Please try again or message us on WhatsApp.", "doneTitle": "Thank you!", "doneBody": "We received your assessment. A Linea dentist will message you on WhatsApp within 24 hours.", "doneWa": "Message us on WhatsApp now", "back": "Back to the website", "waText": "Hi! I just sent the free assessment. My name: ", "docTitle": "Free smile assessment — Linea Aligners"}}, CONC=[{"k": "crowding", "sq": "Dhëmbë të shtrembër", "en": "Crooked / crowded teeth"}, {"k": "gaps", "sq": "Hapësira mes dhëmbëve", "en": "Gaps between teeth"}, {"k": "bite", "sq": "Kafshim i gabuar", "en": "Bite issues"}, {"k": "relapse", "sq": "Dhëmbët lëvizën pas aparatit", "en": "Teeth moved after braces"}, {"k": "unsure", "sq": "Nuk jam i sigurt", "en": "Not sure"}], SLOTS=[{"k": "smile", "sq": "Buzëqeshje (para)", "en": "Smile (front)"}, {"k": "upper", "sq": "Dhëmbët e sipërm", "en": "Upper teeth"}, {"k": "lower", "sq": "Dhëmbët e poshtëm", "en": "Lower teeth"}];
var SUPA=supabase.createClient('https://edlkuctthlutcelyukoh.supabase.co','sb_publishable_k2rMFCJWaVU5aGLKKqI97w_UH0qFtxS',{auth:{persistSession:false}});
var params=new URLSearchParams(location.search);
var lang=params.get('lang')==='en'?'en':'sq';
var concern=null, files={}, f=document.getElementById('f'), errEl=document.getElementById('err'), btn=document.getElementById('submitBtn');
function t(k){return T[lang][k]||k}
function render(){
  document.documentElement.lang=lang; document.title=t('docTitle');
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'))});
  document.getElementById('langBtn').textContent=lang==='sq'?'EN':'SQ';
  var chips=document.getElementById('chips'); chips.innerHTML='';
  CONC.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='chip'+(concern===c.k?' on':'');b.textContent=c[lang];b.onclick=function(){concern=concern===c.k?null:c.k;render()};chips.appendChild(b)});
  var slots=document.getElementById('slots'); slots.innerHTML='';
  SLOTS.forEach(function(s){
    var d=document.createElement('label');d.className='slot'+(files[s.k]?' has':'');
    if(files[s.k]){var img=document.createElement('img');img.src=URL.createObjectURL(files[s.k]);img.alt='';d.appendChild(img)}
    else{d.innerHTML='<span class="plus">+</span>';var sp=document.createElement('span');sp.textContent=s[lang];d.appendChild(sp)}
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('aria-label',s[lang]);
    inp.onchange=function(){if(inp.files&&inp.files[0]){files[s.k]=inp.files[0];render()}};
    d.appendChild(inp);slots.appendChild(d);
  });
}
document.getElementById('langBtn').onclick=function(){lang=lang==='sq'?'en':'sq';render()};
function compress(file){
  if(!window.createImageBitmap)return Promise.resolve(file);
  return createImageBitmap(file).then(function(bmp){
    var s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return new Promise(function(r){c.toBlob(function(b){r(b||file)},'image/jpeg',0.85)});
  }).catch(function(){return file});
}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2))}
f.onsubmit=async function(e){
  e.preventDefault(); errEl.textContent='';
  if(f.website.value)return;
  var name=f.name.value.trim(), phone=f.phone.value.trim();
  if(!name||phone.replace(/\D/g,'').length<8){errEl.textContent=t('errReq');return}
  if(!f.consent.checked){errEl.textContent=t('errConsent');return}
  btn.disabled=true;btn.textContent=t('sending');
  try{
    var id=uid(), paths=[];
    for(var i=0;i<SLOTS.length;i++){
      var s=SLOTS[i], file=files[s.k]; if(!file)continue;
      var blob=await compress(file), type=blob.type||file.type||'image/jpeg', ext=type==='image/jpeg'?'jpg':(type.split('/')[1]||'jpg');
      var path=id+'/'+s.k+'.'+ext;
      var up=await SUPA.storage.from('leads').upload(path,blob,{contentType:type,upsert:false});
      if(!up.error)paths.push(path);
    }
    var c=CONC.find(function(x){return x.k===concern});
    var res=await SUPA.from('leads').insert({name:name,phone:phone,city:f.city.value.trim()||null,concern:c?c.en:null,message:f.message.value.trim()||null,photo_paths:paths});
    if(res.error)throw res.error;
    document.getElementById('waBtn').href='https://wa.me/38349772307?text='+encodeURIComponent(t('waText')+name);
    document.getElementById('formView').classList.add('hidden');
    document.getElementById('doneView').classList.remove('hidden');
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(ex){
    console.error(ex); errEl.textContent=t('errSend'); btn.disabled=false; btn.textContent=t('submit');
  }
};
render();
})();
</script>
</body>
</html>
