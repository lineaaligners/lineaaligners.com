        emergencies:0,lastActivity:0,apptDaysAhead:7,

      })));
      if(eR.data) setEmergs(eR.data.map(e=>({
        id:e.id,patientId:e.patient_id,type:e.type,status:e.status,note:e.note||'',
        daysAgo:Math.round((new Date()-new Date(e.created_at))/(86400000))
      })));
      if(mR.data) setMsgs(mR.data.map(m=>({
        id:m.id,patientId:m.patient_id,from:'patient',text:m.content,
        hoursAgo:Math.round((new Date()-new Date(m.created_at))/(3600000))
      })));
      setLoading(false);

  if(!ok)return h(AuthGate,{onOk:()=>setOk(true)});

  let filtered=patients;
  if(filter==='active')filtered=filtered.filter(p=>p.status==='active');
  else if(filter==='finishing')filtered=filtered.filter(p=>p.status==='finishing');
  else if(filter==='emergency')filtered=filtered.filter(p=>p.emergencies>0);
  else if(filter==='today')filtered=filtered.filter(p=>p.nextChangeDays<=1||(p.hasAppt&&p.apptDaysAhead<=1));

  // ── STATS ──
  const stats={
    total:patients.length,
    active:patients.filter(p=>p.status==='active').length,
    finishing:patients.filter(p=>p.status==='finishing').length,

  const deletePatient=(id)=>{

    h('div',{className:'dialog fade-up',style:{width:'min(720px,calc(100vw - 32px))',maxHeight:'92vh'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}},
        h('div',{style:{display:'flex',alignItems:'center',gap:14}},
          h('div',{style:{width:52,height:52,borderRadius:'50%',background:'var(--color-accent-900)',border:'1px solid var(--color-accent-700)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:18,color:'var(--color-accent-300)'}},initials(selected.first,selected.last)),
          h('div',null,
            h('h2',{style:{fontSize:20,fontWeight:700,margin:0}},`${selected.first} ${selected.last}`),
            h('p',{style:{fontSize:12,opacity:.6,margin:'2px 0 0'}},`${selected.city} · Started ${selected.startDaysAgo}d ago`))),
        h('button',{className:'btn btn-icon btn-secondary',onClick:()=>setSelected(null)},h('i',{className:'ph ph-x'}))),
      // Aligner progress
      h('div',{style:{padding:20,borderRadius:12,background:'linear-gradient(135deg,var(--color-accent-900),var(--color-surface))',border:'1px solid var(--color-divider)',marginBottom:16}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          h('div',null,
            h('p',{style:{fontSize:11,opacity:.6,fontWeight:600,margin:0,textTransform:'uppercase',letterSpacing:'.08em'}},'Current aligner'),
            h('p',{style:{fontSize:40,fontWeight:700,margin:0,letterSpacing:'-.02em'}},selected.currentAligner,h('span',{style:{fontSize:18,opacity:.5,fontWeight:500}},` / ${selected.totalAligners}`))),
          h('div',{style:{textAlign:'right'}},
            h('p',{style:{fontSize:11,opacity:.6,fontWeight:600,margin:0,textTransform:'uppercase',letterSpacing:'.08em'}},'Next change'),
            h('p',{style:{fontSize:20,fontWeight:700,margin:0,color:selected.nextChangeDays<=1?'#fbbf24':'inherit'}},selected.nextChangeDays===0?'Today':selected.nextChangeDays===1?'Tomorrow':`in ${selected.nextChangeDays}d`))),
        h('div',{style:{height:6,background:'var(--color-neutral-800)',borderRadius:999,overflow:'hidden',marginBottom:12}},
          h('div',{style:{height:'100%',background:'var(--color-accent)',width:(selected.currentAligner/selected.totalAligners*100)+'%'}})),
        h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
          h('button',{className:'btn btn-primary',style:{fontSize:12},onClick:()=>advanceAligner(selected.id),disabled:selected.currentAligner>=selected.totalAligners},h('i',{className:'ph ph-arrow-right'}),'Advance aligner'),
          h('a',{href:`https://wa.me/${selected.phone.replace(/\D/g,'')}`,target:'_blank',className:'btn btn-secondary',style:{fontSize:12}},h('i',{className:'ph ph-whatsapp-logo',style:{color:'#25D366'}}),'WhatsApp'),
          h('a',{href:`tel:${selected.phone}`,className:'btn btn-secondary',style:{fontSize:12}},h('i',{className:'ph ph-phone'}),'Call'))),
      // Info grid
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}},
        [['Streak',selected.streak+'d','ph-flame','#ff9d4d'],
         ['Payment',`${selected.payment.paid}/${selected.payment.total}`,'ph-credit-card','var(--color-accent-300)'],
         ['Scans sent',selected.scans,'ph-image','var(--color-accent-2-400)'],
         ['Appt',selected.hasAppt?selected.apptDaysAhead+'d':'—','ph-calendar','var(--color-gold)']]
        .map(([l,v,i,c])=>h('div',{key:l,style:{padding:12,borderRadius:10,background:'var(--color-neutral-900)',border:'1px solid var(--color-divider)',textAlign:'center'}},
          h('i',{className:`ph ${i}`,style:{color:c,fontSize:18}}),
          h('p',{style:{fontSize:18,fontWeight:700,margin:'6px 0 2px'}},v),
          h('p',{style:{fontSize:10,opacity:.55,margin:0,textTransform:'uppercase',letterSpacing:'.08em'}},l)))),
      // Contact
      h('div',{style:{padding:16,borderRadius:10,background:'var(--color-neutral-900)',border:'1px solid var(--color-divider)',marginBottom:16}},
        h('p',{style:{fontSize:11,opacity:.55,fontWeight:600,margin:'0 0 6px',textTransform:'uppercase',letterSpacing:'.08em'}},'Contact'),
        h('p',{style:{fontSize:13,margin:'2px 0'}},h('i',{className:'ph ph-phone',style:{opacity:.5,marginRight:8}}),selected.phone),
        h('p',{style:{fontSize:13,margin:'2px 0'}},h('i',{className:'ph ph-envelope',style:{opacity:.5,marginRight:8}}),selected.email)),
      // Notes
      selected.notes&&h('div',{style:{padding:16,borderRadius:10,background:'var(--color-neutral-900)',border:'1px solid var(--color-divider)'}},
        h('p',{style:{fontSize:11,opacity:.55,fontWeight:600,margin:'0 0 6px',textTransform:'uppercase',letterSpacing:'.08em'}},'Clinical notes'),
        h('p',{style:{fontSize:13,margin:0,lineHeight:1.5}},selected.notes))));

  // ── ADD PATIENT DIALOG ──
  const AddDlg=addOpen&&h(AddPatientDlg,{onCancel:()=>setAddOpen(false),onSave:addPatient});

  // ── CONFIRM DLG ──
  const ConfirmDlg=confirm&&h('div',{className:'dialog-backdrop'},
    h('div',{className:'dialog',style:{width:'min(400px,calc(100vw - 32px))'}},
      h('h3',{style:{fontSize:16,fontWeight:700,marginBottom:8}},'Please confirm'),
      h('p',{style:{opacity:.7,fontSize:14,marginBottom:20}},confirm.text),
      h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
        h('button',{className:'btn btn-secondary',onClick:()=>setConfirm(null)},'Cancel'),
        h('button',{className:'btn btn-primary',onClick:()=>{const f=confirm.fn;setConfirm(null);f()}},'Confirm'))));

  // ── TOASTS ──
  const Toasts=toasts.length>0&&h('div',{style:{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:250,display:'flex',flexDirection:'column',gap:8,alignItems:'center',pointerEvents:'none'}},
    toasts.map(t=>h('div',{key:t.id,className:'fade-up',style:{pointerEvents:'auto',padding:'10px 18px',borderRadius:999,background:'color-mix(in srgb,var(--color-surface) 80%,transparent)',backdropFilter:'blur(20px)',border:'1px solid color-mix(in srgb,#fff 14%,transparent)',boxShadow:'var(--shadow-md)',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8}},
      h('i',{className:'ph ph-check-circle',style:{color:'var(--color-success)'}}),t.msg)));

  const Loader=h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'60vh',flexDirection:'column',gap:16,opacity:.6}},h('i',{className:'ph ph-circle-notch',style:{fontSize:40,animation:'spin 1s linear infinite'}}),h('p',{style:{fontSize:14}},'Loading...'));
  const views={dashboard:loading?Loader:Dashboard,patients:loading?Loader:Patients,appointments:loading?Loader:Appointments,emergencies:loading?Loader:Emergencies,messages:loading?Loader:Messages,analytics:loading?Loader:Analytics,settings:Settings};

  return h('div',{style:{display:'flex',minHeight:'100vh'}},
    Sidebar,
    // Mobile menu button
    h('button',{onClick:()=>setSidebar(!sidebarOpen),style:{display:sidebarOpen?'none':'flex',position:'fixed',top:16,left:16,zIndex:90,width:40,height:40,borderRadius:8,background:'var(--color-surface)',border:'1px solid var(--color-divider)',color:'var(--color-text)',cursor:'pointer',alignItems:'center',justifyContent:'center'},className:'sidebar-toggle'},
      h('i',{className:'ph ph-list',style:{fontSize:20}})),
    h('main',{className:'main-shift',style:{flex:1,padding:'32px 24px 60px',maxWidth:'100%',overflow:'auto'}},views[tab]),
    Drawer,AddDlg,ConfirmDlg,Toasts);
}

function AddPatientDlg({onCancel,onSave}){
  const [f,setF]=useState({first:'',last:'',phone:'',email:'',city:'',totalAligners:20});
  const submit=e=>{e.preventDefault();onSave(f)};
  return h('div',{className:'dialog-backdrop'},
    h('form',{onSubmit:submit,className:'dialog fade-up'},
      h('h3',{style:{fontSize:18,fontWeight:700,marginBottom:16}},'Add patient'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}},
        h('div',null,h('label',{style:{fontSize:11,opacity:.6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}},'First name'),h('input',{className:'input',required:true,value:f.first,onChange:e=>setF({...f,first:e.target.value}),style:{marginTop:4}})),
        h('div',null,h('label',{style:{fontSize:11,opacity:.6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}},'Surname'),h('input',{className:'input',required:true,value:f.last,onChange:e=>setF({...f,last:e.target.value}),style:{marginTop:4}}))),
      h('div',{style:{marginBottom:12}},h('label',{style:{fontSize:11,opacity:.6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}},'Phone'),h('input',{className:'input',required:true,type:'tel',value:f.phone,onChange:e=>setF({...f,phone:e.target.value}),style:{marginTop:4}})),
      h('div',{style:{marginBottom:12}},h('label',{style:{fontSize:11,opacity:.6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}},'Email'),h('input',{className:'input',required:true,type:'email',value:f.email,onChange:e=>setF({...f,email:e.target.value}),style:{marginTop:4}})),
      h('div',{style:{marginBottom:12}},h('label',{style:{fontSize:11,opacity:.6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}},'City'),h('input',{className:'input',required:true,value:f.city,onChange:e=>setF({...f,city:e.target.value}),style:{marginTop:4}})),
      h('div',{style:{marginBottom:20}},h('label',{style:{fontSize:11,opacity:.6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}},'Total aligners planned'),h('input',{className:'input',required:true,type:'number',min:1,max:60,value:f.totalAligners,onChange:e=>setF({...f,totalAligners:Number(e.target.value)}),style:{marginTop:4}})),
      h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
        h('button',{type:'button',className:'btn btn-secondary',onClick:onCancel},'Cancel'),
        h('button',{type:'submit',className:'btn btn-primary'},h('i',{className:'ph ph-plus'}),'Add patient'))));
}

try{createRoot(document.getElementById('root')).render(h(App))}catch(e){const el=document.getElementById('err');if(el){el.style.display='block';el.textContent='Error: '+e.message+'\n'+e.stack}}
})();
</script>
</body>
</html>
