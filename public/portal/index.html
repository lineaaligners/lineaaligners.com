<style>
  :root{
    --color-bg:#0b1220;
    --color-surface:#141d33;
    --color-text:#f5f7fa;
    --color-divider: color-mix(in srgb, #e9e9ed 14%, transparent);
    --color-neutral-800:#1b2440;
    --color-neutral-900:#111a2f;

    --color-accent:#4169e1;
    --color-accent-100:#eef2ff;
    --color-accent-200:#dbe4fe;
    --color-accent-300:#aec2f7;
    --color-accent-400:#7d9df0;
    --color-accent-500:#4169e1;
    --color-accent-600:#3355bd;
    --color-accent-700:#284294;
    --color-accent-800:#1d2f6b;
    --color-accent-900:#141f47;

    --color-accent-2:#5bb8dd;
    --color-accent-2-100:#f0faff;
    --color-accent-2-200:#d6f2fc;
    --color-accent-2-300:#b3e6f7;
    --color-accent-2-400:#87ceeb;
    --color-accent-2-500:#5bb8dd;
    --color-accent-2-600:#3a92b8;
    --color-accent-2-700:#2a6f8c;
    --color-accent-2-800:#1e4f63;
    --color-accent-2-900:#15353f;

    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;

    --radius-sm:8px; --radius-md:12px; --radius-lg:20px;

    --shadow-md: 0 8px 24px rgba(0,0,0,.28);
    --shadow-lg: 0 20px 48px rgba(0,0,0,.36);

    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-heading: 'Fraunces', 'Inter', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font-body);
    background: var(--color-bg);
    color: var(--color-text);
    font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1,h2,h3,h4{ font-feature-settings:"tnum" 1,"cv11" 1; margin:0; }
  a{ color: var(--color-accent-300); text-decoration:none; }
  a:hover{ color: var(--color-accent-200); }
  ::-webkit-scrollbar{ height:0; width:0; }
  input, button, textarea{ font-family: inherit; }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 16px;
    border-radius: var(--radius-md);
    border:1px solid color-mix(in srgb, #ffffff 12%, transparent);
    background: color-mix(in srgb, #ffffff 5%, transparent);
    color: var(--color-text);
    font-weight:600; font-size:14px;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease, opacity .2s ease;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  .btn:hover{ background: color-mix(in srgb, #ffffff 9%, transparent); }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{
    background: var(--color-accent);
    border-color: var(--color-accent-700);
    color:#fff;
  }
  .btn-primary:hover{ background: var(--color-accent-600); }
  .btn-secondary{
    background: color-mix(in srgb, #ffffff 5%, transparent) !important;
  }
  .btn-block{ display:flex; width:100%; }

  /* Fields */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; opacity:.7; }
  .input{
    padding:10px 14px;
    border-radius: var(--radius-md);
    background: color-mix(in srgb, #ffffff 4%, transparent);
    border:1px solid color-mix(in srgb, #ffffff 12%, transparent);
    color: var(--color-text);
    font-size:14px;
    outline:none;
    transition: border .2s ease, background .2s ease;
  }
  .input:focus{ border-color: var(--color-accent-500); background: color-mix(in srgb, #ffffff 7%, transparent); }
  .input::placeholder{ color: color-mix(in srgb, var(--color-text) 40%, transparent); }

  /* Cards */
  .card{
    display:flex; flex-direction:column; gap: var(--space-3);
    padding: var(--space-5);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--color-surface) 52%, transparent);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid color-mix(in srgb, #ffffff 9%, transparent);
  }
  .card h2{
    font-family: var(--font-heading);
    font-size:19px;
    font-weight:600;
    letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .dialog{
    background: color-mix(in srgb, var(--color-surface) 55%, transparent);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    backdrop-filter: blur(26px) saturate(160%);
    border:1px solid color-mix(in srgb, #ffffff 12%, transparent);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    display:flex; flex-direction:column; gap: var(--space-4);
  }
  .dialog-backdrop{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    padding: var(--space-4);
    background: rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .dialog-title{ font-family: var(--font-heading); font-size:20px; margin:0; }
  .dialog-body{ font-size:14px; opacity:.75; margin:0; line-height:1.5; }

  /* Segmented (language toggle) */
  .seg{
    display:inline-flex;
    padding:3px;
    border-radius: 999px;
    background: color-mix(in srgb, #ffffff 5%, transparent);
    border:1px solid color-mix(in srgb, #ffffff 10%, transparent);
    gap: 2px;
  }
  .seg-opt{
    padding:5px 12px;
    border-radius: 999px;
    font-size:12px; font-weight:600;
    color: color-mix(in srgb, var(--color-text) 55%, transparent);
    cursor:pointer;
    display:inline-flex; align-items:center;
    transition: background .2s ease, color .2s ease;
  }
  .seg-opt input{ display:none; }
  .seg-opt.active{
    background: var(--color-accent);
    color:#fff;
  }

  /* Toggle switch */
  .switch{
    position:relative;
    width:42px; height:24px;
    border-radius: 999px;
    background: color-mix(in srgb, #ffffff 10%, transparent);
    cursor:pointer;
    transition: background .2s ease;
    flex:none;
  }
  .switch::after{
    content:"";
    position:absolute; top:2px; left:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:#fff;
    transition: transform .2s ease;
  }
  .switch.on{ background: var(--color-accent); }
  .switch.on::after{ transform: translateX(18px); }

  /* Animations */
  @keyframes lineaFadeUp{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes lineaFadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes lineaLogoIn{ 0%{opacity:0;transform:scale(.82)} 100%{opacity:1;transform:scale(1)} }
  @keyframes lineaGlow{ 0%,100%{opacity:.5} 50%{opacity:.9} }
  @keyframes lineaDot{ 0%,80%,100%{opacity:.25;transform:scale(.7)} 40%{opacity:1;transform:scale(1)} }
  .linea-fade-up{ animation: lineaFadeUp .55s cubic-bezier(.16,1,.3,1) both; }
  .linea-fade-in{ animation: lineaFadeIn .6s ease both; }

  /* Layout / responsive */
  .linea-tab-row{ display:flex; }
  .linea-mobile-nav{ display:none; }
  .linea-brand-word{ display:inline; }
  .linea-hero-grid{ grid-template-columns: 1fr auto; }
  .linea-2col{ display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
  .linea-3col{ display:grid; grid-template-columns: repeat(3,1fr); gap: var(--space-5); }
  .linea-doctor-card{ display:flex; align-items:center; gap: var(--space-5); }
  main{ padding-bottom: 32px; }
  @media (max-width: 720px){
    .linea-tab-row{ display:none; }
    .linea-mobile-nav{ display:flex; }
    .linea-brand-word{ display:none; }
    .linea-hero-grid{ grid-template-columns: 1fr !important; }
    .linea-2col{ grid-template-columns: 1fr !important; }
    .linea-3col{ grid-template-columns: 1fr !important; }
    .linea-doctor-card{ flex-direction: column !important; text-align:center; align-items:center !important; }
    .linea-doctor-card > div:last-child{ width:100%; }
    .linea-doctor-card a{ width:100%; justify-content:center; }
    main{ padding-bottom: 100px !important; }
  }

  /* Print */
  @media print{
    body{ background:#fff; color:#000; }
    .no-print, header, nav, .linea-mobile-nav, .dialog-backdrop button{ display:none !important; }
    .card, .dialog{ background:#fff !important; border:1px solid #ccc !important; color:#000 !important; box-shadow:none !important; backdrop-filter:none !important; }
    h1,h2,h3,p,span,div{ color:#000 !important; }
  }
</style>

  const loadPersisted = () => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e){ return {}; }
  };
  const persist = (data) => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){}
  };

  const greetingKey = () => {
    const h = new Date().getHours();
    if (h < 12) return 'morning';
    if (h < 18) return 'afternoon';
    return 'evening';
  };

  const fmtDate = (date, withYear, language) => {
    return date.toLocaleDateString(language === 'sq' ? 'sq-AL' : 'en-GB', {
      day:'numeric', month:'long', ...(withYear ? {year:'numeric'} : {})
    });
  };

  const inputDateVal = (d) => {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
  };

  const buildDayCells = (startDate, todayDate) => {
    // 10 cells starting from `startDate`
    const cells = [];
    const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (let i=0; i<10; i++){
      const d = new Date(startDate.getTime() + i*DAY_MS);
      const isPast = d < todayDate && !isSameDay(d, todayDate);
      const isToday = isSameDay(d, todayDate);
      cells.push({
        weekday: weekdays[d.getDay()],
        num: d.getDate(),
        isPast, isToday,
        showNum: !isPast,
        borderColor: isToday ? 'var(--color-accent-500)' : 'color-mix(in srgb, #ffffff 8%, transparent)',
        bg: isToday ? 'color-mix(in srgb, var(--color-accent) 25%, transparent)' : 'color-mix(in srgb, var(--color-surface) 40%, transparent)',
        color: isPast ? 'var(--color-accent-2-400)' : 'var(--color-text)'
      });
    }
    return cells;
  };
  const isSameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

  function Upload({ t, language, state, actions }){
    const { scans } = state;
    const inputRef = useRef(null);
    const handleFile = (file) => {
      if (!file) return;
      actions.addScan({ name: file.name, size: file.size });
    };
    return (
      <div style={{display:'flex',flexDirection:'column',gap:'var(--space-8)'}}>
        <div>
          <h1 style={{fontFamily:'var(--font-heading)',fontSize:'30px',fontWeight:600}}>{t.uploadTitle}</h1>

        </div>

        <div
          onClick={()=>inputRef.current?.click()}
          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{ e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}
          style={{border:'2px dashed color-mix(in srgb, #ffffff 22%, transparent)',borderRadius:'var(--radius-lg)',height:'220px',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'12px',cursor:'pointer',background:'color-mix(in srgb, var(--color-surface) 30%, transparent)',transition:'border .2s ease, background .2s ease'}}

          <p style={{margin:0,opacity:.75}}>{t.uploadDrop}</p>
          <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
        </div>

        <div className="card" style={{padding:'var(--space-6)'}}>
          <h2>{t.yourUploads}</h2>
          {scans.length === 0 ? (
            <p style={{opacity:.5,fontSize:'13px',margin:0}}>—</p>

            <div style={{display:'flex',flexDirection:'column',gap:'10px',marginTop:'var(--space-2)'}}>
              {scans.map((scan,i) => (
                <div key={i} style={{display:'flex',alignItems:'center',gap:'12px',padding:'12px',borderRadius:'var(--radius-md)',background:'color-mix(in srgb, var(--color-surface) 40%, transparent)',border:'1px solid color-mix(in srgb, #ffffff 8%, transparent)'}}>

                  <div style={{flex:1,minWidth:0}}>
                    <p style={{margin:0,fontWeight:600,fontSize:'14px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{scan.name}</p>
                    <p style={{margin:0,opacity:.5,fontSize:'12px'}}>{fmtDate(new Date(scan.date), false, language)} · {(scan.size/1024).toFixed(0)} KB</p>
                  </div>
                  <i className="ph ph-eye" style={{opacity:.5}}/>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

            <button className="btn btn-secondary" onClick={onClose}>{t.cancel}</button>
            <button className="btn btn-primary" onClick={onSubmit}><i className="ph ph-paper-plane-tilt"/> {t.emergencySubmit}</button>
          </div>
        </div>
      </div>
    );
  }

  function ReportDialog({ t, language, open, state, onClose, onPrint }){
    if (!open) return null;
    const { profile, currentAligner, totalAligners, progressPct, streakDays, treatmentStartDate, estimatedFinishStr } = state;
    return (
      <div className="dialog-backdrop">
        <div className="dialog" style={{width:'min(500px,100%)'}}>
          <h3 className="dialog-title">{t.reportTitle}</h3>
          <p className="dialog-body">{t.reportGeneratedOn} {fmtDate(new Date(), true, language)}</p>
          <div style={{display:'grid',gridTemplateColumns:'auto 1fr',gap:'10px 20px',fontSize:'14px'}}>
            <span style={{opacity:.55}}>{t.reportPatient}</span><strong>{profile.name}</strong>
            <span style={{opacity:.55}}>{t.reportAligner}</span><strong>{currentAligner} / {totalAligners}</strong>
            <span style={{opacity:.55}}>{t.reportProgress}</span><strong>{progressPct}%</strong>
            <span style={{opacity:.55}}>{t.reportStreak}</span><strong>{streakDays} days</strong>
            <span style={{opacity:.55}}>{t.reportStart}</span><strong>{fmtDate(treatmentStartDate, true, language)}</strong>
            <span style={{opacity:.55}}>{t.reportFinish}</span><strong>{estimatedFinishStr}</strong>
          </div>
          <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',flexWrap:'wrap'}}>
            <button className="btn btn-secondary" onClick={onClose}>{t.close}</button>
            <button className="btn btn-primary" onClick={onPrint}><i className="ph ph-printer"/> {t.reportPrint}</button>
          </div>
        </div>
      </div>
    );
  }

  function CelebrateDialog({ t, milestone, onClose }){
    if (!milestone) return null;
    return (
      <div className="dialog-backdrop" onClick={onClose}>
        <div className="dialog linea-fade-up" style={{width:'min(400px,100%)',textAlign:'center',alignItems:'center'}}>
          <div style={{fontSize:'52px'}}>🎉</div>
          <h3 className="dialog-title">{t.celebrateTitle}</h3>
          <p className="dialog-body">{t.celebrateBody.replace('{pct}', String(milestone))}</p>
          <button className="btn btn-primary" onClick={onClose}>{t.celebrateClose}</button>
        </div>
      </div>
    );
  }

  function View3DDialog({ t, open, onClose }){
    if (!open) return null;
    return (
      <div className="dialog-backdrop">
        <div className="dialog" style={{width:'min(560px,100%)'}}>
          <h3 className="dialog-title">{t.view3DTitle}</h3>
          <div style={{aspectRatio:'16/10',borderRadius:'var(--radius-md)',background:'linear-gradient(135deg, var(--color-accent-900), var(--color-accent-2-900))',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--color-accent-2-300)',opacity:.8}}>
            <i className="ph ph-cube-transparent" style={{fontSize:'56px'}}/>
          </div>
          <p className="dialog-body">{t.view3DBody}</p>
          <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',flexWrap:'wrap'}}>
            <button className="btn btn-secondary" onClick={onClose}>{t.close}</button>
            <a href={WHATSAPP_URL} target="_blank" rel="noopener noreferrer" className="btn btn-primary"><i className="ph ph-whatsapp-logo"/> {t.contactClinic}</a>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════
  // MAIN APP
  // ═══════════════════════════════════════════
  function App(){
    // Persistent state
    const persisted = useMemo(loadPersisted, []);
    const [language, setLanguage] = useState(persisted.language || 'en');
    const [authed, setAuthed] = useState(!!persisted.authed);
    const [showSplash, setShowSplash] = useState(false);
    const [activeTab, setActiveTab] = useState('dashboard');
    const [reg, setReg] = useState(persisted.reg || { firstName:'', lastName:'', phone:'', email:'', city:'' });

    // Treatment state
    const [currentAligner, setCurrentAligner] = useState(persisted.currentAligner ?? 7);
    const [totalAligners] = useState(20);
    const [nextChangeOffsetDays, setNextChangeOffsetDays] = useState(persisted.nextChangeOffsetDays ?? 4);
    const [appointmentOffsetDays, setAppointmentOffsetDays] = useState(persisted.appointmentOffsetDays ?? 9);
    const [treatmentStartOffsetDays] = useState(persisted.treatmentStartOffsetDays ?? -65);
    const [streakDays, setStreakDays] = useState(persisted.streakDays ?? 24);
    const [scans, setScans] = useState(persisted.scans || []);
    const [beforeAfterPct, setBeforeAfterPct] = useState(50);
    const [emergencyRequested, setEmergencyRequested] = useState(false);
    const [referralCode] = useState(persisted.referralCode || 'LINEA-' + Math.random().toString(36).slice(2,7).toUpperCase());

    // Reminders / notifications
    const [reminders, setReminders] = useState(persisted.reminders || { remindWear:true, remindChange:true, remindAppt:true });
    const [notifPermission, setNotifPermission] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'default');

    // Dialogs
    const [editingChangeDate, setEditingChangeDate] = useState(false);
    const [changeDateInputVal, setChangeDateInputVal] = useState('');
    const [confirmDialog, setConfirmDialog] = useState(null); // { text, onAccept }
    const [schedulingDialog, setSchedulingDialog] = useState(false);
    const [emergencyDialog, setEmergencyDialog] = useState(false);
    const [emergencyType, setEmergencyType] = useState('broken');
    const [reportDialog, setReportDialog] = useState(false);
    const [celebrateMilestone, setCelebrateMilestone] = useState(null);
    const [viewing3D, setViewing3D] = useState(false);
    const [toasts, setToasts] = useState([]);

    const t = T[language] || T.en;

    // Persist state
    useEffect(() => {
      persist({
        language, authed, reg,
        currentAligner, nextChangeOffsetDays, appointmentOffsetDays, treatmentStartOffsetDays,
        streakDays, scans, reminders, referralCode
      });
    }, [language, authed, reg, currentAligner, nextChangeOffsetDays, appointmentOffsetDays, treatmentStartOffsetDays, streakDays, scans, reminders, referralCode]);

    // Auto-dismiss splash
    useEffect(() => {
      if (!showSplash) return;
      const id = setTimeout(() => setShowSplash(false), 2200);
      return () => clearTimeout(id);
    }, [showSplash]);

    // Toast helper
    const pushToast = useCallback((msg) => {
      const id = Date.now() + Math.random();
      setToasts(x => [...x, { id, msg }]);
      setTimeout(() => setToasts(x => x.filter(t => t.id !== id)), 3000);
    }, []);

    // Milestone celebration effect
    useEffect(() => {
      const pct = Math.round((currentAligner / totalAligners) * 100);
      const milestones = [25, 50, 75, 100];
      const hit = milestones.find(m => pct >= m && !window[`_lineaCele_${m}`]);
      if (hit) {
        window[`_lineaCele_${hit}`] = true;
        setCelebrateMilestone(hit);
        const id = setTimeout(() => setCelebrateMilestone(null), 4200);
        return () => clearTimeout(id);
      }
    }, [currentAligner, totalAligners]);

    // ── Computed values ──────────────────────
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const nextChangeDate = new Date(today.getTime() + nextChangeOffsetDays * DAY_MS);
    const appointmentDate = new Date(today.getTime() + appointmentOffsetDays * DAY_MS);
    const treatmentStartDate = new Date(today.getTime() + treatmentStartOffsetDays * DAY_MS);
    const remainingAligners = totalAligners - currentAligner;
    const estimatedFinishDate = new Date(today.getTime() + (remainingAligners * 10 + nextChangeOffsetDays) * DAY_MS);
    const changeDaysLeft = Math.max(0, Math.round((nextChangeDate - today) / DAY_MS));
    const progressPct = Math.round((currentAligner / totalAligners) * 100);
    const weeksLeft = Math.max(1, Math.ceil((remainingAligners * 10 + nextChangeOffsetDays) / 7));
    const estimatedFinishStr = estimatedFinishDate.toLocaleDateString(language === 'sq' ? 'sq-AL' : 'en-GB', { month:'long', year:'numeric' });
    const showReminderBanner = changeDaysLeft <= 1;
    const isMaxAligner = currentAligner >= totalAligners;

    const firstName = reg.firstName || 'Arta';
    const initials = ((reg.firstName || 'A')[0] + (reg.lastName ? reg.lastName[0] : '')).toUpperCase();
    const greeting = t.greetings[greetingKey()];

    const motivateMsg =
      progressPct < 20 ? t.motivateLow :
      progressPct < 50 ? t.motivateMid :
      progressPct < 85 ? t.motivateHigh : t.motivateNear;

    // Day-tracker: 10 cells starting from (nextChangeDate - 9 days)
    const trackerStart = new Date(nextChangeDate.getTime() - 9 * DAY_MS);
    const dayCells = buildDayCells(trackerStart, today);

    // Aligner grid
    const alignerGrid = Array.from({length: totalAligners}, (_,i) => {
      const n = i + 1;
      const isPast = n < currentAligner;
      const isCurrent = n === currentAligner;
      const isFuture = n > currentAligner;
      return {
        n, isPast, isCurrent, isFuture,
        bg: isCurrent ? 'var(--color-accent)' : isPast ? 'color-mix(in srgb, var(--color-accent) 25%, transparent)' : 'color-mix(in srgb, var(--color-surface) 40%, transparent)',
        borderColor: isCurrent ? 'var(--color-accent-500)' : isPast ? 'var(--color-accent-700)' : 'color-mix(in srgb, #ffffff 8%, transparent)',
        color: isCurrent ? '#fff' : isPast ? 'var(--color-accent-2-300)' : 'var(--color-text)',
        onClick: () => {
          if (isCurrent) return;
          setConfirmDialog({
            text: t.updateConfirm.replace('{n}', String(n)),
            onAccept: () => {
              setCurrentAligner(n);
              setNextChangeOffsetDays(10);
              setStreakDays(s => s + 1);
              pushToast(t.toastAlignerChanged);
            }
          });
        }
      };
    });

    const badges = [
      { icon:'ph-medal', label: t.badgeFirst, unlocked: currentAligner >= 1 },
      { icon:'ph-chart-line-up', label: t.badgeHalfway, unlocked: currentAligner / totalAligners >= 0.5 },
      { icon:'ph-camera', label: t.badgePhotoPro, unlocked: scans.length >= 2 },
      { icon:'ph-flame', label: t.badgeStreak, unlocked: streakDays >= 7 },
    ].map(b => ({
      ...b,
      bg: b.unlocked ? 'color-mix(in srgb, var(--color-accent) 18%, transparent)' : 'var(--color-neutral-900)',
      borderColor: b.unlocked ? 'var(--color-accent-700)' : 'var(--color-divider)',
      color: b.unlocked ? 'var(--color-accent-300)' : 'color-mix(in srgb, var(--color-text) 45%, transparent)',
      opacity: b.unlocked ? 1 : 0.55,
    }));

    const profile = {
      name: [reg.firstName, reg.lastName].filter(Boolean).join(' ') || 'Arta Krasniqi',
      email: reg.email || 'arta.krasniqi@example.com',
      phone: reg.phone || '+383 49 772 307',
      city: reg.city || 'Peja, Kosova',
      timezone: (typeof Intl !== 'undefined' ? Intl.DateTimeFormat().resolvedOptions().timeZone : 'UTC'),
    };

    const slots = [2, 5, 9, 14].map(offset => {
      const d = new Date(now.getTime() + offset * DAY_MS);
      d.setHours(10, 30, 0, 0);
      return { offset, dateStr: fmtDate(d, true, language) + ' · 10:30' };
    });

    // ── Actions ──────────────────────────────
    const actions = {
      openScheduling: () => setSchedulingDialog(true),
      closeScheduling: () => setSchedulingDialog(false),
      pickSlot: (slot) => {
        setSchedulingDialog(false);
        setConfirmDialog({
          text: t.slotConfirm.replace('{d}', slot.dateStr),
          onAccept: () => {
            setAppointmentOffsetDays(slot.offset);
            pushToast(t.toastAppointmentBooked);
          }
        });
      },
      openEmergency: () => { setEmergencyType('broken'); setEmergencyDialog(true); },
      closeEmergency: () => setEmergencyDialog(false),
      submitEmergency: () => {
        setEmergencyDialog(false);
        setConfirmDialog({
          text: t.emergencyConfirm.replace('{type}', emergencyType === 'broken' ? t.emergencyBrokenOpt.toLowerCase() : t.emergencyLostOpt.toLowerCase()),
          onAccept: () => {
            setEmergencyRequested(true);
            pushToast(t.toastEmergencySubmitted);
          }
        });
      },
      openReport: () => setReportDialog(true),
      closeReport: () => setReportDialog(false),
      printReport: () => window.print(),
      open3D: () => setViewing3D(true),
      close3D: () => setViewing3D(false),
      advanceAligner: () => {
        if (isMaxAligner) return;
        setConfirmDialog({
          text: t.changedConfirm.replace('{n}', String(currentAligner + 1)),
          onAccept: () => {
            setCurrentAligner(x => x + 1);
            setNextChangeOffsetDays(10);
            setStreakDays(s => s + 1);
            pushToast(t.toastAlignerChanged);
          }
        });
      },
      startEditChangeDate: () => {
        setChangeDateInputVal(inputDateVal(nextChangeDate));
        setEditingChangeDate(true);
      },
      onChangeDateInput: (e) => setChangeDateInputVal(e.target.value),
      saveChangeDate: () => {
        const d = new Date(changeDateInputVal + 'T00:00:00');
        if (!isNaN(d)) {
          const offset = Math.round((d - today) / DAY_MS);
          setNextChangeOffsetDays(Math.max(0, offset));
        }
        setEditingChangeDate(false);
      },
      cancelEditChangeDate: () => setEditingChangeDate(false),
      addScan: (scan) => {
        setScans(x => [...x, { ...scan, date: Date.now() }]);
        pushToast(t.scanSent);
      },
      setBeforeAfter: (pct) => setBeforeAfterPct(pct),
      toggleReminder: (key) => setReminders(r => ({ ...r, [key]: !r[key] })),
      requestNotifPermission: async () => {
        if (typeof Notification === 'undefined') return;
        try {
          const perm = await Notification.requestPermission();
          setNotifPermission(perm);
        } catch (e) {}
      },
      signOut: () => {
        setConfirmDialog({
          text: t.signOut + '?',
          onAccept: () => {
            setAuthed(false);
            pushToast(t.toastSignedOut);
          }
        });
      },
    };

    const submitLogin = () => {
      setAuthed(true);
      setShowSplash(true);
    };

    const tabs = [
      { id:'dashboard', label:t.tabs.dashboard, icon:'ph-house' },
      { id:'progress', label:t.tabs.progress, icon:'ph-chart-line-up' },
      { id:'upload', label:t.tabs.upload, icon:'ph-camera' },
      { id:'appointment', label:t.tabs.appointment, icon:'ph-calendar-blank' },
      { id:'help', label:t.tabs.help, icon:'ph-lifebuoy' },
      { id:'settings', label:t.tabs.settings, icon:'ph-gear' },
    ];

    const sharedState = {
      firstName, greeting, motivateMsg, streakDays, badges,
      currentAligner, totalAligners, progressPct, nextChangeDate, changeDaysLeft, isMaxAligner,
      estimatedFinishStr, weeksLeft, appointmentDate, appointmentDaysLeft: appointmentOffsetDays,
      dayCells, editingChangeDate, todayInputVal: inputDateVal(today), changeDateInputVal,
      showReminderBanner, alignerGrid, treatmentStartDate, beforeAfterPct,
      scans, profile, reminders, notifPermission, referralCode, emergencyRequested,
    };

    return (
      <div style={{minHeight:'100vh',background:'radial-gradient(circle at 15% 0%, var(--color-accent-900), transparent 55%), radial-gradient(circle at 100% 20%, var(--color-accent-2-900), transparent 50%), var(--color-bg)',position:'relative'}}>
        {!authed && <LoginScreen t={t} reg={reg} setReg={setReg} onSubmit={submitLogin}/>}
        {showSplash && <SplashScreen t={t} onDismiss={() => setShowSplash(false)}/>}

        <Header
          t={t} language={language} setLanguage={setLanguage}
          initials={initials} activeTab={activeTab} setActiveTab={setActiveTab}
          tabs={tabs}
          onBack={() => window.location.href = '/'}
        />

        <MobileNav tabs={tabs} activeTab={activeTab} setActiveTab={setActiveTab}/>

        <main style={{maxWidth:'1080px',margin:'0 auto',padding:'var(--space-6) var(--space-6) var(--space-8)'}}>
          {activeTab === 'dashboard' && <Dashboard t={t} language={language} state={sharedState} actions={actions}/>}
          {activeTab === 'progress' && <Progress t={t} language={language} state={sharedState} actions={actions}/>}
          {activeTab === 'upload' && <Upload t={t} language={language} state={sharedState} actions={actions}/>}
          {activeTab === 'appointment' && <Appointment t={t} language={language} state={sharedState} actions={actions}/>}
          {activeTab === 'help' && <Help t={t} state={sharedState} actions={actions}/>}
          {activeTab === 'settings' && <Settings t={t} state={sharedState} actions={actions}/>}
        </main>

        <Toasts toasts={toasts}/>
        <ConfirmDialog
          t={t}
          open={!!confirmDialog}
          text={confirmDialog?.text || ''}
          onCancel={() => setConfirmDialog(null)}
          onAccept={() => {
            const cb = confirmDialog?.onAccept;
            setConfirmDialog(null);
            if (cb) cb();
          }}
        />
        <SchedulingDialog t={t} open={schedulingDialog} slots={slots} onClose={actions.closeScheduling} onPick={actions.pickSlot}/>
        <EmergencyDialog t={t} open={emergencyDialog} type={emergencyType} setType={setEmergencyType} onClose={actions.closeEmergency} onSubmit={actions.submitEmergency} requested={emergencyRequested}/>
        <ReportDialog t={t} language={language} open={reportDialog} state={sharedState} onClose={actions.closeReport} onPrint={actions.printReport}/>
        <CelebrateDialog t={t} milestone={celebrateMilestone} onClose={() => setCelebrateMilestone(null)}/>
        <View3DDialog t={t} open={viewing3D} onClose={actions.close3D}/>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App/>);
  </script>
</body>
</html>
