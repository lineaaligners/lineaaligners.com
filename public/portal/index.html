<style>
:root{
  --color-bg:#0b1220;
  --color-surface:#141d33;
  --color-text:#e9e9ed;
  --color-divider:color-mix(in srgb,#e9e9ed 14%,transparent);
  --color-neutral-800:#1e2740;
  --color-neutral-900:#111827;
  --color-accent:#4169e1;
  --color-accent-100:#eef2ff;--color-accent-200:#dbe4fe;--color-accent-300:#aec2f7;
  --color-accent-400:#7d9df0;--color-accent-500:#4169e1;--color-accent-600:#3355bd;
  --color-accent-700:#284294;--color-accent-800:#1d2f6b;--color-accent-900:#141f47;
  --color-accent-2:#5bb8dd;
  --color-accent-2-300:#b3e6f7;--color-accent-2-400:#87ceeb;--color-accent-2-500:#5bb8dd;
  --color-accent-2-600:#3a92b8;--color-accent-2-700:#2a6f8c;--color-accent-2-800:#1e4f63;--color-accent-2-900:#15353f;
  --font-body:'Inter',system-ui,sans-serif;
  --font-heading:'Inter',system-ui,sans-serif;
  --space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;
  --space-7:1.75rem;--space-8:2rem;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;
  --shadow-md:0 4px 16px rgba(0,0,0,.35);--shadow-lg:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);min-height:100vh}
a{color:var(--color-accent-300)}
a:hover{color:var(--color-accent-200)}
::-webkit-scrollbar{height:0;width:0}
/* cards */
.card{background:color-mix(in srgb,var(--color-surface) 52%,transparent);backdrop-filter:blur(22px) saturate(160%);border:1px solid color-mix(in srgb,#fff 9%,transparent);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:var(--space-4)}
.dialog{background:color-mix(in srgb,var(--color-surface) 55%,transparent);backdrop-filter:blur(26px) saturate(160%);border:1px solid color-mix(in srgb,#fff 12%,transparent);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4);width:min(420px,calc(100vw - 32px));max-height:85vh;overflow-y:auto}
.dialog-backdrop{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:var(--space-4);background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.dialog-title{font-size:17px;font-weight:600}
.dialog-body{opacity:.7;font-size:14px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:var(--space-2)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-md);border:none;cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:600;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--color-accent);color:#fff}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:color-mix(in srgb,#fff 5%,transparent);backdrop-filter:blur(10px);color:var(--color-text);border:1px solid color-mix(in srgb,#fff 12%,transparent)}
.btn-secondary:hover{background:color-mix(in srgb,#fff 10%,transparent)}
.btn-block{width:100%;justify-content:center}
.btn-icon{padding:8px}
/* fields */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;opacity:.65}
.input{background:color-mix(in srgb,#fff 6%,transparent);border:1px solid color-mix(in srgb,#fff 14%,transparent);border-radius:var(--radius-md);padding:9px 12px;color:var(--color-text);font-family:var(--font-body);font-size:14px;outline:none;transition:border-color .2s;width:100%}
.input:focus{border-color:var(--color-accent-500)}
/* seg */
.seg{display:flex;gap:2px;background:color-mix(in srgb,#fff 6%,transparent);border-radius:var(--radius-md);padding:3px}
.seg-opt{display:flex;align-items:center;cursor:pointer;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--radius-sm);transition:background .15s}
.seg-opt input{display:none}
.seg-opt:has(input:checked){background:var(--color-accent);color:#fff}
/* tag */
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:12px;font-weight:600;padding:4px 12px}
.tag-accent{background:color-mix(in srgb,var(--color-accent) 20%,transparent);color:var(--color-accent-300);border:1px solid var(--color-accent-700)}
/* elev */
.elev-sm{box-shadow:var(--shadow-md)}
/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes logoIn{0%{opacity:0;transform:scale(.82)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.fade-up{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) both}
.fade-in{animation:fadeIn .6s ease both}
/* responsive */
.tab-row{display:flex}
.mobile-nav{display:none}
@media(max-width:720px){
  .tab-row{display:none}
  .mobile-nav{display:flex}
  .brand-word{display:none}
  .hero-grid{grid-template-columns:1fr !important}
  .doctor-card{flex-direction:column !important;text-align:center;align-items:center !important}
  .doctor-card>div:last-child{width:100%}
  .doctor-card a{width:100%;justify-content:center}
  .col2{grid-template-columns:1fr !important}
  .col3{grid-template-columns:1fr !important}
}
</style>

const fmtDate=(date,lang,withTime)=>{
  const loc=lang==='sq'?'sq-AL':'en-GB';
  return withTime
    ?date.toLocaleString(loc,{dateStyle:'full',timeStyle:'short'})
    :date.toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long'});
};

function App(){
  const [lang,setLang]=useState('en');
  const [tab,setTab]=useState('dashboard');
  const [authed,setAuthed]=useState(false);
  const [showSplash,setShowSplash]=useState(false);
  const [reg,setReg]=useState({first:'',last:'',phone:'',email:'',city:''});
  const [currentAligner,setCurrentAligner]=useState(7);
  const [totalAligners]=useState(20);
  const [nextChangeDays,setNextChangeDays]=useState(4);
  const [apptDays,setApptDays]=useState(9);
  const [treatStartDays]=useState(-65);
  const [editDate,setEditDate]=useState(false);
  const [dateInput,setDateInput]=useState('');
  const [streak]=useState(6);
  const [baSlider,setBaSlider]=useState(50);
  const [paidInst,setPaidInst]=useState(3);
  const [totalInst]=useState(6);
  const [toasts,setToasts]=useState([]);
  const [confirm,setConfirm]=useState(null);
  const [scheduling,setScheduling]=useState(false);
  const [emergency,setEmergency]=useState(false);
  const [emergType,setEmergType]=useState('broken');
  const [emergRequested,setEmergRequested]=useState(false);
  const [reportDlg,setReportDlg]=useState(false);
  const [celebrate,setCelebrate]=useState(null);
  const [remindWear,setRemindWear]=useState(true);
  const [remindChange,setRemindChange]=useState(true);
  const [remindAppt,setRemindAppt]=useState(true);
  const [notifPerm,setNotifPerm]=useState(typeof Notification!=='undefined'?Notification.permission:'default');
  const [viewing3D,setViewing3D]=useState(false);
  const [scans]=useState([
    {id:1,fileName:'Upper_Arch_Scan.jpg',fileSize:'2.4 MB',daysAgo:12},
    {id:2,fileName:'Progress_Check_Week6.jpg',fileSize:'1.8 MB',daysAgo:26}
  ]);
  const splashTimer=useRef(null);
  const celebTimer=useRef(null);

  const t=T[lang];
  const now=new Date();
  const today0=new Date(now);today0.setHours(0,0,0,0);

  const toast=(msg)=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg}]);
    setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),3000);
  };

  const login=(e)=>{e.preventDefault();setAuthed(true);setShowSplash(true);splashTimer.current=setTimeout(()=>setShowSplash(false),2200);};
  const dismissSplash=()=>{clearTimeout(splashTimer.current);setShowSplash(false);};

  const doConfirm=(text,onAccept)=>setConfirm({text,onAccept});
  const acceptConfirm=()=>{const cb=confirm?.onAccept;setConfirm(null);cb&&cb();};

  const doSetAligner=(n)=>{
    const prevPct=Math.round((currentAligner/totalAligners)*100);
    const nextPct=Math.round((n/totalAligners)*100);
    const crossed=[25,50,75,100].find(m=>prevPct<m&&nextPct>=m);
    setCurrentAligner(n);setNextChangeDays(10);
    if(crossed){setCelebrate(crossed);clearTimeout(celebTimer.current);celebTimer.current=setTimeout(()=>setCelebrate(null),4200);}
  };

  const advanceAligner=()=>{
    const next=Math.min(currentAligner+1,totalAligners);
    doConfirm(t.changedConfirm.replace('{n}',next),()=>{doSetAligner(next);toast(t.toastAlignerChanged);});
  };

  const pickAligner=(n)=>{
    doConfirm(t.updateConfirm.replace('{n}',n),()=>{doSetAligner(n);toast(t.toastAlignerChanged);});
  };

  const signOut=()=>{setTab('dashboard');toast(t.toastSignedOut);};

  const saveDate=()=>{
    if(!dateInput)return;
    const chosen=new Date(dateInput+'T00:00:00');
    const diff=Math.round((chosen.getTime()-today0.getTime())/DAY);
    setNextChangeDays(diff);setEditDate(false);
  };
